<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="profile-card">

        <div class="profile-top">
            <img src="NEOKY.jpg" alt="Profile Picture" class="pfp">

            <div class="student-info">
                <h1>Neovan Reyes</h1>
                <p>SENIOR HIGH SCHOOL STUDENT</p>
            </div>
        </div>

        <div class="divider"></div>

        <div class="details">
            <div class="detail">
                <span>ACADEMIC YEAR</span>
                <strong>2026-2027</strong>
            </div>

            <div class="detail">
                <span>YEAR LEVEL</span>
                <strong>Grade 12</strong>
            </div>

            <div class="detail">
                <span>SECTION</span>
                <strong>ICT - CAMEROON</strong>
            </div>
        </div>

        <div class="card-footer">
            <span>STUDENT PROFILE</span>
            <span>2026-2027</span>
        </div>

        <div class="Job">
            <h2>Dream Job</h2>
            <p>Software Engineer</p>
        </div>

    </div>

</body>
</html>
